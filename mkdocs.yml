site_name: DarkWing Swift Reporter
theme:
  name: material
  custom_dir: overrides
  icon:
    logo: swift
  favicon: img/swift.ico
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting Started:
      - Setup: setup.md
      - Tutorial: tutorial-1.md
  - Project Memory: project_memory.md
  - System Deep Dives:
      - Architecture: architecture.md
      - Detector Algorithm: detector_algorithm.md
      - AI Integration: ai_integration.md
      - Payload Extraction Spec: payload_extraction_spec.md
      - Project Requirements: prd.md
      - API Reference: api_reference.md
      - Secrets Handling: secrets_handling.md
      - Deployment: deployment.md
  - Methodologies & Validation: test_strategy.md
  - Pydantic AI Migration:
      - Artifact Pyramid: pydantic-migration/00-index.md
      - Overview: pydantic-migration/README.md
      - Migration Design: pydantic-migration/03-dossiers/darkwing-pydantic-ai-migration.md
      - Reference Scaffold: pydantic-migration/03-dossiers/scaffold-full-reference.md
