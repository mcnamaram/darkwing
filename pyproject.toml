[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "darkwing"
version = "0.3.0"
description = "Automated observation reporting for Chimney Swifts"
requires-python = ">=3.14"
dependencies = [
    "pydantic>=2.13",
    "playwright>=1.40",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1",
    "pytest-asyncio>=0.26.0",
    "pytest-playwright-asyncio>=0.9.0",
]

[project.scripts]
darkwing = "darkwing.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
