name: Deploy Apps Script

on:
  push:
    branches: [main]
    paths:
      - 'apps_script/Code.js'
      - 'apps_script/appsscript.json'
      - '.github/workflows/deploy-apps-script.yml'

# Prevent concurrent deployments
concurrency:
  group: "apps-script-deploy"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Google Apps Script
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.18'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Authenticate with clasp
        run: |
          echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json
          echo '${{ secrets.CLASP_JSON }}' > .clasp.json

      - name: Push to Apps Script
        run: clasp push --rootDir apps_script --force

      - name: Create version and deploy
        run: |
          clasp deploy --description "Deployed from GitHub Actions on ${{ github.sha }}"

      - name: Get deployment URL
        run: clasp list
